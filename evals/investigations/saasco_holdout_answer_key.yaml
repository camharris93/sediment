# Answer key for the saasco_holdout planted-truth dataset (holdout variant).
#
# NEVER shown to the planner, skeptic or judge (tests/test_prompt_leak.py).
# `truths[].observed` is WRITTEN BY datasets/saasco/generate.py from the data
# itself; do not edit by hand. `python evals/harness.py --investigate --truths
# --dataset saasco_holdout` re-checks every observed value against the built warehouse
# through L3-L5.
#
# Match grammar (evals/investigations/score.py — deterministic, no LLM). A
# finding's Claim matches a signature when EVERY key present holds:
#   metric_in:     claim.metric is one of these
#   dimension_any: some claim dimension matches one of these (fnmatch patterns)
#   dimension_all: every pattern matches some claim dimension
#   segment:       every key (fnmatch) has a claim segment entry with an equal value
#                  (case-insensitive; true == "true")
#   direction / direction_any: claim.direction
#   quirk_tables:  (quirks only) flagged via L6 fanout, skeptic, or a proposed quirk
# kind: driver | trap | quirk | decoy | absent
dataset: saasco_holdout
variant: holdout
stories:
  - id: S1
    kind: driver
    statement: >-
      Annual accounts churn at renewal, and the large 2025-Q2 annual cohort renewing in 2026-Q2
      drives the Q2 2026 rise in churn.
    mechanism: >-
      A 2025-Q2 promotion pulled in a big annual-prepay cohort with many low-usage accounts.
      Prepaid accounts cannot churn mid-term, so the churn is deferred to the renewal month;
      their usage falls 3-5 months before.
    found_by: >-
      Churn by billing_interval x months-to-renewal (or tenure month 12/24) plus the size of the
      2025-Q2 annual cohort.
    naive: >-
      Reading the Q2 2026 spike as a product or market problem.
    match:
      - {metric_in: [logo_churn_rate, revenue_churn_rate], dimension_any: [billing_interval], segment: {billing_interval: annual}, direction: higher}
      - {dimension_any: ['derived:*renew*', 'derived:*months_to*', 'derived:*anniversar*'], direction: higher}
      - {dimension_any: [cohort_month, 'derived:*cohort*'], segment: {billing_interval: annual}, direction: higher}
    truths:
      - id: S1.t1
        description: "Renewal-month churn rate of annual subscriptions due to renew in 2026-Q2."
        fixture_sql: |
          with due as (select s.end_date, cast(unnest(generate_series(s.start_date + interval 12 month, date '2026-06-30', interval 12 month)) as date) as renewal
            from saasco_holdout_staging.stg_subscriptions s where s.billing_interval = 'annual')
          select avg(case when d.end_date = d.renewal then 1.0 else 0.0 end) from due d
          where d.renewal between date '2026-04-01' and date '2026-06-30' and (d.end_date is null or d.end_date >= d.renewal)
        observed: 0.264
        tolerance_abs: 0.03
      - id: S1.t2
        description: "Mean monthly logo churn rate, 2026-Q2 divided by 2026-Q1."
        fixture_sql: |
          with sp as (select s.account_id, min(s.start_date) as first_start, case when bool_or(s.end_date is null) then null else max(s.end_date) end as account_end from saasco_holdout_staging.stg_subscriptions s group by s.account_id),
          mo as (select cast(unnest(generate_series(date '2026-01-01', date '2026-06-01', interval 1 month)) as date) as m),
          r as (select mo.m as month_start, avg(case when sp.account_end >= mo.m and sp.account_end < mo.m + interval 1 month then 1.0 else 0.0 end) as rate
            from mo join sp on sp.first_start < mo.m and (sp.account_end is null or sp.account_end >= mo.m) group by mo.m)
          select avg(r.rate) filter (where r.month_start >= date '2026-04-01') / avg(r.rate) filter (where r.month_start < date '2026-04-01') from r
        observed: 1.1313
        tolerance_rel: 0.10
      - id: S1.t3
        description: "Annual subscriptions started in 2025-Q2 divided by those started in 2024-Q2."
        fixture_sql: |
          select count(*) filter (where start_date between date '2025-04-01' and date '2025-06-30') * 1.0
            / count(*) filter (where start_date between date '2024-04-01' and date '2024-06-30')
          from saasco_holdout_staging.stg_subscriptions where billing_interval = 'annual'
        observed: 4.013
        tolerance_rel: 0.15
  - id: S2
    kind: driver
    statement: >-
      A starter price increase on 2025-03-01 (grandfathered for existing subscriptions) splits
      cohorts: new starter accounts after the change churn early far more than the pre-change
      cohort, while existing starters are unaffected.
    mechanism: >-
      Starter list_price_monthly steps up for subscriptions starting on/after the change date;
      the post-change new cohort has a much higher 90-day churn hazard.
    found_by: >-
      Early (90-day) churn by start_date before/after the price step within plan_tier = starter,
      discovered through the list_price_monthly step.
    naive: >-
      Averaging old and new starters together ('starter churn barely moved').
    match:
      - {dimension_any: [start_date, list_price_monthly, cohort_month, 'derived:*price*', 'derived:*cohort*', 'derived:*period*'], segment: {plan_tier: starter}, direction: higher}
      - {metric_in: [early_churn_rate], dimension_any: [list_price_monthly, 'derived:*price*'], direction: higher}
    truths:
      - id: S2.t1
        description: "Starter (monthly, new accounts) 90-day churn: 6 months after the price change / 6 months before."
        fixture_sql: |
          with sp as (select s.account_id, min(s.start_date) as first_start, case when bool_or(s.end_date is null) then null else max(s.end_date) end as account_end from saasco_holdout_staging.stg_subscriptions s group by s.account_id),
          fs as (select s.plan_tier, s.billing_interval, s.start_date, sp.account_end from saasco_holdout_staging.stg_subscriptions s
            join sp on sp.account_id = s.account_id and s.start_date = sp.first_start),
          c as (select fs.start_date >= date '2025-03-01' as post, avg(case when fs.account_end < fs.start_date + interval 90 day then 1.0 else 0.0 end) as r
            from fs where fs.billing_interval = 'monthly' and fs.plan_tier = 'starter'
            and fs.start_date >= date '2025-03-01' - interval 6 month and fs.start_date < date '2025-03-01' + interval 6 month group by 1)
          select max(c.r) filter (where c.post) / max(c.r) filter (where not c.post) from c
        observed: 1.4036
        tolerance_rel: 0.15
      - id: S2.t2
        description: "Same ratio for growth + pro (the control: should be near 1)."
        fixture_sql: |
          with sp as (select s.account_id, min(s.start_date) as first_start, case when bool_or(s.end_date is null) then null else max(s.end_date) end as account_end from saasco_holdout_staging.stg_subscriptions s group by s.account_id),
          fs as (select s.plan_tier, s.billing_interval, s.start_date, sp.account_end from saasco_holdout_staging.stg_subscriptions s
            join sp on sp.account_id = s.account_id and s.start_date = sp.first_start),
          c as (select fs.start_date >= date '2025-03-01' as post, avg(case when fs.account_end < fs.start_date + interval 90 day then 1.0 else 0.0 end) as r
            from fs where fs.billing_interval = 'monthly' and fs.plan_tier <> 'starter'
            and fs.start_date >= date '2025-03-01' - interval 6 month and fs.start_date < date '2025-03-01' + interval 6 month group by 1)
          select max(c.r) filter (where c.post) / max(c.r) filter (where not c.post) from c
        observed: 0.8745
        tolerance_rel: 0.15
  - id: S3
    kind: driver
    statement: >-
      From 2026-01 a payment-failure spike in LATAM causes involuntary churn that is recorded as
      voluntary: most LATAM cancellations in 2026 follow 2+ failed payment attempts, yet
      cancel_reason says customer_request or is null.
    mechanism: >-
      Card-on-file failures for tenured LATAM accounts from 2026-01; failed retries end the
      subscription.
    found_by: >-
      Share of churners with failed attempts before end_date, by region and period.
    naive: >-
      Trusting cancel_reason: 'LATAM customers are choosing to leave'.
    match:
      - {metric_in: [failed_payment_share], segment: {region: LATAM}, direction: higher}
      - {dimension_any: [failed_attempts_30d, failed_attempts_before_end, 'derived:*fail*', 'derived:*payment*', 'derived:*involuntary*'], segment: {region: LATAM}, direction: higher}
      - {dimension_all: [region, '*fail*'], segment: {region: LATAM}, direction: higher}
    truths:
      - id: S3.t1
        description: "Share of LATAM accounts churned in 2026 with >= 2 failed attempts in the 30 days before churn."
        fixture_sql: |
          with sp as (select s.account_id, min(s.start_date) as first_start, case when bool_or(s.end_date is null) then null else max(s.end_date) end as account_end from saasco_holdout_staging.stg_subscriptions s group by s.account_id),
          ch as (select sp.account_id, sp.account_end, a.region from sp join saasco_holdout_staging.stg_accounts a on a.account_id = sp.account_id
            where sp.account_end >= date '2026-01-01'),
          f as (select ch.account_id, count(i.invoice_id) as n_failed from ch left join saasco_holdout_staging.stg_invoices i
            on i.account_id = ch.account_id and i.status = 'failed'
            and i.invoice_date between ch.account_end - interval 30 day and ch.account_end group by ch.account_id)
          select avg(case when n_failed >= 2 then 1.0 else 0.0 end) from ch join f using (account_id) where region = 'LATAM'
        observed: 0.5484
        tolerance_abs: 0.05
      - id: S3.t2
        description: "Same share for all other regions."
        fixture_sql: |
          with sp as (select s.account_id, min(s.start_date) as first_start, case when bool_or(s.end_date is null) then null else max(s.end_date) end as account_end from saasco_holdout_staging.stg_subscriptions s group by s.account_id),
          ch as (select sp.account_id, sp.account_end, a.region from sp join saasco_holdout_staging.stg_accounts a on a.account_id = sp.account_id
            where sp.account_end >= date '2026-01-01'),
          f as (select ch.account_id, count(i.invoice_id) as n_failed from ch left join saasco_holdout_staging.stg_invoices i
            on i.account_id = ch.account_id and i.status = 'failed'
            and i.invoice_date between ch.account_end - interval 30 day and ch.account_end group by ch.account_id)
          select avg(case when n_failed >= 2 then 1.0 else 0.0 end) from ch join f using (account_id) where region <> 'LATAM'
        observed: 0.0469
        tolerance_abs: 0.03
      - id: S3.t3
        description: "Of those LATAM failed-payment churners, the share whose final cancel_reason is customer_request or null."
        fixture_sql: |
          with sp as (select s.account_id, min(s.start_date) as first_start, case when bool_or(s.end_date is null) then null else max(s.end_date) end as account_end from saasco_holdout_staging.stg_subscriptions s group by s.account_id),
          ch as (select sp.account_id, sp.account_end, a.region from sp join saasco_holdout_staging.stg_accounts a on a.account_id = sp.account_id
            where sp.account_end >= date '2026-01-01'),
          f as (select ch.account_id, count(i.invoice_id) as n_failed from ch left join saasco_holdout_staging.stg_invoices i
            on i.account_id = ch.account_id and i.status = 'failed'
            and i.invoice_date between ch.account_end - interval 30 day and ch.account_end group by ch.account_id)
          select avg(case when s.cancel_reason is null or s.cancel_reason = 'customer_request' then 1.0 else 0.0 end)
          from ch join f using (account_id) join saasco_holdout_staging.stg_subscriptions s on s.account_id = ch.account_id and s.end_date = ch.account_end
          where ch.region = 'LATAM' and f.n_failed >= 2
        observed: 0.9882
        tolerance_abs: 0.05
  - id: S4
    kind: absent
    statement: >-
      ABSENT on holdout: activation has no effect on churn here. A confirmed activation finding
      is a FALSE finding.
    mechanism: >-
      No mechanism; low activation exists at the same rate as dev but does not change churn.
    found_by: >-
      Churn by first-8-week activation bucket.
    naive: >-
      Carrying the dev-set activation story over.
    match:
      - {dimension_any: [first_8wk_peak_active_users, 'derived:*activat*', 'derived:*first_8*', 'derived:*onboard*', 'derived:*early_usage*', 'derived:*first_week*'], direction_any: [higher, lower]}
    truths:
      - id: S4.t1
        description: "Monthly-billed new accounts (signup < 2026-01): churn in tenure months 2-6, low activation / high activation."
        fixture_sql: |
          with sp as (select s.account_id, min(s.start_date) as first_start, case when bool_or(s.end_date is null) then null else max(s.end_date) end as account_end from saasco_holdout_staging.stg_subscriptions s group by s.account_id),
          pk as (select sp.account_id, max(u.active_users) as peak from sp join saasco_holdout_staging.stg_usage_weekly u
            on u.account_id = sp.account_id and u.week_start < sp.first_start + interval 56 day group by sp.account_id),
          fs as (select sp.account_id, sp.first_start, sp.account_end, s.billing_interval from sp
            join saasco_holdout_staging.stg_subscriptions s on s.account_id = sp.account_id and s.start_date = sp.first_start),
          c as (select pk.peak <= 2 as low,
            avg(case when fs.account_end >= fs.first_start + interval 1 month and fs.account_end < fs.first_start + interval 6 month then 1.0 else 0.0 end) as r
            from fs join pk on pk.account_id = fs.account_id where fs.billing_interval = 'monthly' and fs.first_start < date '2026-01-01' group by 1)
          select max(c.r) filter (where c.low) / max(c.r) filter (where not c.low) from c
        observed: 0.9323
        tolerance_rel: 0.15
  - id: S5
    kind: trap
    statement: >-
      Sales assistance REDUCES churn within every company size band, but pooled, sales-assisted
      accounts churn more because they are concentrated in the high-churn 1-10 band (Simpson's
      paradox).
    mechanism: >-
      sales_assisted is assigned mostly to 1-10 accounts; within each band it multiplies the
      churn hazard by < 1.
    found_by: >-
      Stratify sales_assisted churn by company_size_band.
    naive: >-
      'Sales-assisted accounts churn more' is a FALSE finding.
    match_correct:
      - {dimension_all: [sales_assisted, '*size_band'], segment: {sales_assisted: true}, direction: lower}
    match_naive:
      - {dimension_any: [sales_assisted], segment: {sales_assisted: true}, direction: higher}
    truths:
      - id: S5.t1
        description: "Pooled monthly logo churn rate (account-months), sales-assisted / not."
        fixture_sql: |
          with sp as (select s.account_id, min(s.start_date) as first_start, case when bool_or(s.end_date is null) then null else max(s.end_date) end as account_end from saasco_holdout_staging.stg_subscriptions s group by s.account_id),
          m as (select cast(unnest(generate_series(date '2024-02-01', date '2026-06-01', interval 1 month)) as date) as m),
          am as (select a.company_size_band as b, a.sales_assisted as sa,
            case when sp.account_end >= m.m and sp.account_end < m.m + interval 1 month then 1.0 else 0.0 end as c
            from m join sp on sp.first_start < m.m and (sp.account_end is null or sp.account_end >= m.m)
            join saasco_holdout_staging.stg_accounts a on a.account_id = sp.account_id)
          select avg(c) filter (where sa) / avg(c) filter (where not sa) from am
        observed: 1.2669
        tolerance_rel: 0.10
      - id: S5.t2
        description: "Number of size bands (of 4) in which sales-assisted churn is lower."
        fixture_sql: |
          with sp as (select s.account_id, min(s.start_date) as first_start, case when bool_or(s.end_date is null) then null else max(s.end_date) end as account_end from saasco_holdout_staging.stg_subscriptions s group by s.account_id),
          m as (select cast(unnest(generate_series(date '2024-02-01', date '2026-06-01', interval 1 month)) as date) as m),
          am as (select a.company_size_band as b, a.sales_assisted as sa,
            case when sp.account_end >= m.m and sp.account_end < m.m + interval 1 month then 1.0 else 0.0 end as c
            from m join sp on sp.first_start < m.m and (sp.account_end is null or sp.account_end >= m.m)
            join saasco_holdout_staging.stg_accounts a on a.account_id = sp.account_id)
          , by_b as (select b, avg(c) filter (where sa) as rs, avg(c) filter (where not sa) as rn from am group by b)
          select count(*) filter (where rs < rn) from by_b
        observed: 4.0
        tolerance_abs: 0
      - id: S5.t3
        description: "Account-month-weighted mean of the within-band ratio (sales-assisted / not)."
        fixture_sql: |
          with sp as (select s.account_id, min(s.start_date) as first_start, case when bool_or(s.end_date is null) then null else max(s.end_date) end as account_end from saasco_holdout_staging.stg_subscriptions s group by s.account_id),
          m as (select cast(unnest(generate_series(date '2024-02-01', date '2026-06-01', interval 1 month)) as date) as m),
          am as (select a.company_size_band as b, a.sales_assisted as sa,
            case when sp.account_end >= m.m and sp.account_end < m.m + interval 1 month then 1.0 else 0.0 end as c
            from m join sp on sp.first_start < m.m and (sp.account_end is null or sp.account_end >= m.m)
            join saasco_holdout_staging.stg_accounts a on a.account_id = sp.account_id)
          , by_b as (select b, count(*) as n, avg(c) filter (where sa) as rs, avg(c) filter (where not sa) as rn from am group by b)
          select sum(n * rs / rn) / sum(n) from by_b
        observed: 0.7233
        tolerance_rel: 0.15
  - id: S6
    kind: driver
    statement: >-
      Channel mix shift: from 2025-09-01 the partner channel grows sharply as a share of new
      accounts. It churns about 2x other channels at a constant planted multiplier, so the shift
      alone raises blended new-account churn (other stories also move channel rates).
    mechanism: >-
      partner share of signups ramps up over 3 months; each channel's churn multiplier is
      constant over time.
    found_by: >-
      Churn by channel over time, or a mix-standardized new-account churn rate.
    naive: >-
      'New-customer quality is getting worse across the board.'
    match:
      - {dimension_any: [acquisition_channel, channel], segment: {'*channel': partner}, direction: higher}
      - {metric_in: [new_account_share], segment: {'*channel': partner}, direction: higher}
    truths:
      - id: S6.t1
        description: "partner share of new accounts, 2024-01 through the month before the shift."
        fixture_sql: |
          with sp as (select s.account_id, min(s.start_date) as first_start, case when bool_or(s.end_date is null) then null else max(s.end_date) end as account_end from saasco_holdout_staging.stg_subscriptions s group by s.account_id),
          na as (select a.acquisition_channel as ch, sp.first_start as signup, case when sp.account_end < sp.first_start + interval 90 day then 1.0 else 0.0 end as c
            from sp join saasco_holdout_staging.stg_accounts a on a.account_id = sp.account_id)
          select avg(case when na.ch = 'partner' then 1.0 else 0.0 end) from na where na.signup < date '2025-09-01'
        observed: 0.1054
        tolerance_abs: 0.03
      - id: S6.t2
        description: "partner share of new accounts, 2026-01..2026-06."
        fixture_sql: |
          with sp as (select s.account_id, min(s.start_date) as first_start, case when bool_or(s.end_date is null) then null else max(s.end_date) end as account_end from saasco_holdout_staging.stg_subscriptions s group by s.account_id),
          na as (select a.acquisition_channel as ch, sp.first_start as signup, case when sp.account_end < sp.first_start + interval 90 day then 1.0 else 0.0 end as c
            from sp join saasco_holdout_staging.stg_accounts a on a.account_id = sp.account_id)
          select avg(case when na.ch = 'partner' then 1.0 else 0.0 end) from na where na.signup >= date '2026-01-01'
        observed: 0.2927
        tolerance_abs: 0.03
      - id: S6.t3
        description: "90-day churn of new accounts (signup < 2026-04): partner / all other channels."
        fixture_sql: |
          with sp as (select s.account_id, min(s.start_date) as first_start, case when bool_or(s.end_date is null) then null else max(s.end_date) end as account_end from saasco_holdout_staging.stg_subscriptions s group by s.account_id),
          na as (select a.acquisition_channel as ch, sp.first_start as signup, case when sp.account_end < sp.first_start + interval 90 day then 1.0 else 0.0 end as c
            from sp join saasco_holdout_staging.stg_accounts a on a.account_id = sp.account_id)
          select avg(na.c) filter (where na.ch = 'partner') / avg(na.c) filter (where na.ch <> 'partner') from na where na.signup < date '2026-04-01'
        observed: 2.1158
        tolerance_rel: 0.15
      - id: S6.t4
        description: "Mix effect: blended new-account 90-day churn at post-shift channel mix and PRE-shift channel rates, minus the pre-shift blended rate (absolute; > 0 means mix alone raises churn)."
        fixture_sql: |
          with sp as (select s.account_id, min(s.start_date) as first_start, case when bool_or(s.end_date is null) then null else max(s.end_date) end as account_end from saasco_holdout_staging.stg_subscriptions s group by s.account_id),
          na as (select a.acquisition_channel as ch, sp.first_start as signup, case when sp.account_end < sp.first_start + interval 90 day then 1.0 else 0.0 end as c
            from sp join saasco_holdout_staging.stg_accounts a on a.account_id = sp.account_id)
          , g as (select na.ch, na.signup >= date '2025-09-01' as post, count(*) as n, avg(na.c) as r from na
            where na.signup >= date '2024-01-01' and na.signup < date '2026-04-01' group by 1, 2),
          pre as (select g.ch, g.r from g where not g.post),
          wt as (select g.ch, g.n * 1.0 / sum(g.n) over () as share from g where g.post)
          select (select sum(wt.share * pre.r) from wt join pre on pre.ch = wt.ch) - (select sum(g.n * g.r) / sum(g.n) from g where not g.post)
        observed: 0.0104
        tolerance_abs: 0.01
  - id: S7
    kind: quirk
    statement: >-
      invoices has one row per payment ATTEMPT. Summing invoices.amount without status = 'paid'
      (or summing subscription prices joined to invoices) inflates revenue/MRR; worst in LATAM
      2026.
    mechanism: >-
      Failed retries are separate rows carrying the full amount.
    found_by: >-
      L6 fanout_risk, a skeptic fanout_or_bug reconcile, or a data quirk proposed to memory.
    naive: >-
      Reporting inflated MRR or revenue-churn numbers.
    match:
      - {quirk_tables: [invoices]}
    truths:
      - id: S7.t1
        description: "sum(amount) over all invoice rows / sum(amount) over paid rows."
        fixture_sql: |
          select sum(amount) / sum(amount) filter (where status = 'paid') from saasco_holdout_staging.stg_invoices
        observed: 1.0839
        tolerance_rel: 0.03
      - id: S7.t2
        description: "Same ratio for LATAM accounts, 2026."
        fixture_sql: |
          select sum(i.amount) / sum(i.amount) filter (where i.status = 'paid') from saasco_holdout_staging.stg_invoices i join saasco_holdout_staging.stg_accounts a on a.account_id = i.account_id
          where a.region = 'LATAM' and i.invoice_date >= date '2026-01-01'
        observed: 1.393
        tolerance_rel: 0.05
  - id: D1
    kind: decoy
    statement: >-
      region = 'APAC' (a small group) shows a one-quarter churn blip in 2026-Q1 from sampling
      luck alone.
    mechanism: >-
      No mechanism: the attribute is assigned after simulation, independent of churn; the RNG
      sub-seed was searched so the blip appears.
    found_by: >-
      Skeptic small_n; no persistence in other quarters. Correct output: suggestive, refuted, or
